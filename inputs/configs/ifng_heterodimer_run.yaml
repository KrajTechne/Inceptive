# Interferon-gamma heterodimer binder design. BindCraft2 settings: interferon_gamma_heterodimer_1idx.json;
# target structure: inputs/targets/interferon_gamma_heterodimer_1idx.cif (found by file name).
# The original .cif has insertion codes (residues 122A-122G), which BindCraft2 refuses to load, and
# numbering that starts at 0. interferon_gamma_heterodimer_1idx.cif was made with
#   python structure_helpers.py renumber inputs/targets/interferon_gamma_heterodimer.cif #       --out inputs/targets/interferon_gamma_heterodimer_1idx.cif --start 1 --chain A --coldspots "<original coldspots>"
# so the coldspots in the JSON are the original 11-25,55-67,99-107,131-145,175-187,219-227 converted
# to the new numbering (same residues).
#   python run_pipeline.py --config inputs/configs/ifng_heterodimer_run.yaml --dry-run

run_name: ifng_heterodimer_1idx_60traj

design:
  bindcraft_json: inputs/configs/interferon_gamma_heterodimer_1idx.json
  gpu: "A100:4"              # 4 GPUs; BindCraft2 starts design workers on all of them
  cpu: 16                    # CPU cores and RAM for the container (workers need both)
  memory_gb: 128
  timeout_hours: 3           # hard stop; progress is saved every 5 min and re-running resumes
  bindcraft:
    max_trajectories: 60
    # The JSON has Colab settings that force ONE worker on ONE GPU; undo them for multi-GPU:
    auto_multi_gpu: true
    workers_per_gpu: auto

selection:
  top_n: 4
  binder_chain: B            # CHECK on the first run: the target structure itself has a chain B

validate:
  models: [of3, esmfold2]
  seeds: [0]
  num_samples: 5
  gpu_type: H100
  max_gpus: 5                # validation jobs running at once (one GPU each); the rest wait their turn
  max_retries: 1             # extra attempts for a job that errors (0 = never retry)

report:
  min_iptm: 0.8
  min_ipsae: 0.61
  min_contact_pass_fraction: 1.0
