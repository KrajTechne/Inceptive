# Parallel design test: same PD-L1 miniprotein, but on 4 GPUs.
# BindCraft2 sees all GPUs in the container and starts design workers on each
# by itself (and packs several per GPU if memory allows), so the only change from
# a 1-GPU run is `gpu: A100:4` plus enough CPU/RAM to feed the workers.
#   python run_pipeline.py --config inputs/configs/pdl1_parallel_test.yaml
# Or just the design step:
#   python -m modal run run_design.py --config inputs/configs/pdl1_parallel_test.yaml

run_name: pdl1_parallel_test

design:
  gpu: "A100:4"              # "<type>:<count>"; also H100:4, L40S:2, ...
  cpu: 16                    # CPU cores for the container (workers need CPU to feed the GPUs)
  memory_gb: 128             # RAM for the container. BindCraft2 sizes its worker count from the
                             # NODE's memory, not this limit, so set this generously.
  timeout_hours: 3
  bindcraft:
    target: hPDL1
    binder_lengths: [60, 100]
    number_of_final_designs: 8
    max_trajectories: 60
    aa_bias:
      C: 0
    # Optional BindCraft2 parallelism overrides (see bindcraft2/docs/source/installation.md):
    # workers_per_gpu: 2     # fix workers per card instead of auto-packing (lower this if out of GPU memory)
    # design_workers: 8      # cap total workers

selection:
  top_n: 4
  binder_chain: B

validate:
  models: [of3, esmfold2]
  seeds: [0]
  num_samples: 5
  gpu_type: H100

report:
  min_iptm: 0.8
  min_ipsae: 0.61
  min_contact_pass_fraction: 1.0
